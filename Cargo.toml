[workspace]
members = [".", "bindings"]
default-members = [".", "bindings"]
resolver = "2"

[package]
name = "switchyard"
version = "0.1.0"
edition = "2021"
description = "Switchyard furnishes isolated workspaces for parallel agents, each a worktree on its own branch with its own port range, database name, and env file, and it routes claims by job description and queues the claims that must wait."
license = "MIT"

[lib]
name = "switchyard"
path = "src/lib.rs"

[[bin]]
name = "switchyard"
path = "src/bin/switchyard.rs"

[[bin]]
name = "codepoint_scan"
path = "src/bin/codepoint_scan.rs"

[dependencies]
serde = "1"
serde_json = "1"
fs2 = "0.4"
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"
