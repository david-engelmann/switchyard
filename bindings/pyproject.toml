[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "switchyard"
version = "0.1.0"
description = "Switchyard furnishes isolated workspaces for parallel agents, each a worktree on its own branch with its own port range, database, and env file, and it routes claims by job description and queues the claims that must wait."
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "switchyard._switchyard"
python-source = "../python"
