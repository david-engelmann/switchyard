[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "switchyard"
version = "0.1.0"
description = "A worktree and port orchestrator that gives every parallel agent its own branch, port range, database, and env file with one command"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "switchyard._switchyard"
python-source = "../python"
